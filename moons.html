    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #06060a;
            --bg-elevated: #0e0e14;
            --bg-card: #111118;
            --bg-glass: rgba(14,14,20,0.75);
            --text: #e8e6e1;
            --text-dim: #7a7872;
            --text-faint: #44433e;
            --gold: #c9a86c;
            --gold-bright: #e8c97a;
            --gold-dim: rgba(201,168,108,0.12);
            --border: rgba(201,168,108,0.08);
            --border-hover: rgba(201,168,108,0.2);
            --font-display: 'Cinzel', Georgia, serif;
            --font-body: 'Cinzel', Georgia, serif;
            --font-mono: 'Cinzel', Georgia, serif;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            
            /* Legacy compatibility */
            --color-bg: var(--bg);
            --color-surface: var(--bg-elevated);
            --color-surface-2: var(--bg-card);
            --color-surface-3: var(--bg-card);
            --color-text: var(--text);
            --color-text-secondary: var(--text-dim);
            --color-text-tertiary: var(--text-faint);
            --color-border: var(--border);
            --color-accent: var(--gold);
            --color-accent-bright: var(--gold-bright);
            --font-sans: var(--font-body);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2), 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 2px 4px rgba(0,0,0,0.2), 0 4px 12px rgba(0,0,0,0.35);
            --shadow-lg: 0 4px 8px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.4);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --transition-fast: 150ms cubic-bezier(0.25,0.1,0.25,1);
            --transition-normal: 300ms cubic-bezier(0.25,0.1,0.25,1);
        }
        
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; background: #000; }
        body {
            font-family: var(--font-body);
            background: #000;
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
            font-size: clamp(14px, 3.5vw, 18px);
            overscroll-behavior: none;
        }
        #orrery-canvas { display: block; background: #000; }

        /* ── Navigation ───────────────────────────────── */
        .nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(16px, 4vw, 48px);
            background: rgba(6,6,10,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            transition: border-color 0.4s;
        }
        .nav.scrolled { border-color: var(--border-hover); }
        .nav-logo {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 900;
            color: var(--gold);
            text-decoration: none;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .nav-links { display: flex; gap: 2px; }
        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-family: var(--font-body);
            font-size: 13px; text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 6px;
            transition: color 0.25s, background 0.25s;
        }
        .nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.04); }
        .nav-links a.active { color: var(--gold); }
        .nav-hamburger {
            display: none;
            background: none; border: none; cursor: pointer;
            width: 40px; height: 40px;
            align-items: center; justify-content: center;
        }
        .nav-hamburger span {
            display: block; width: 20px; height: 2px;
            background: var(--text); border-radius: 1px;
            transition: all 0.3s var(--ease-out);
            position: relative;
        }
        .nav-hamburger span::before,
        .nav-hamburger span::after {
            content: ''; position: absolute; left: 0;
            width: 100%; height: 2px; background: var(--text);
            border-radius: 1px; transition: all 0.3s var(--ease-out);
        }
        .nav-hamburger span::before { top: -7px; }
        .nav-hamburger span::after { top: 7px; }
        .nav-hamburger.open span { background: transparent; }
        .nav-hamburger.open span::before { top: 0; transform: rotate(45deg); }
        .nav-hamburger.open span::after { top: 0; transform: rotate(-45deg); }

        .mobile-menu {
            position: fixed; top: 56px; left: 0; right: 0;
            z-index: 99;
            background: rgba(6,6,10,0.97);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 0 20px;
            transform: translateY(-120%);
            opacity: 0;
            transition: all 0.4s var(--ease-out);
            pointer-events: none;
        }
        .mobile-menu.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
        .mobile-menu a {
            display: block; padding: 14px 32px;
            color: var(--text-dim); text-decoration: none;
            font-family: var(--font-body); font-size: 15px; text-transform: uppercase; letter-spacing: 0.1em;
            font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
            transition: color 0.2s;
        }
        .mobile-menu a:hover, .mobile-menu a.active { color: var(--gold); }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .nav-hamburger { display: flex; }
        }

        /* ── Three.js Canvas ── */
        #orrery-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        /* ── Info Panel ── */
        .info-panel {
            position: fixed; top: 0; right: 0; width: 400px; height: 100vh; z-index: 50;
            background: var(--bg-elevated, #0e0e14);
            border-left: 1px solid rgba(255,255,255,0.08);
            transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto; padding: 80px 32px 32px;
            box-shadow: -8px 0 32px rgba(0,0,0,0.5);
        }
        .info-panel.open { transform: translateX(0); }
        .info-panel-close {
            position: absolute; top: 20px; right: 20px; width: 36px; height: 36px;
            border-radius: 50%; border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06); color: #fff; font-size: 18px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; z-index: 2;
        }
        .info-panel-close:hover { background: rgba(255,255,255,0.15); }
        .info-panel .moon-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .info-panel .moon-icon { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; }
        .info-panel .moon-title { font-size: 24px; font-weight: 800; }
        .info-panel .moon-order { font-size: 13px; color: var(--color-text-secondary); letter-spacing: 0.05em; text-transform: uppercase; }
        .info-panel .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .info-panel .info-label { color: var(--color-text-secondary); font-size: 13px; }
        .info-panel .info-value { font-weight: 600; font-size: 14px; }
        .phase-bar-wrap { margin: 16px 0; }
        .phase-bar-bg { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
        .phase-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .info-panel .lore-text { margin-top: 20px; color: var(--color-text-secondary); font-size: 14px; line-height: 1.7; font-style: italic; }

        @media (max-width: 768px) {
            .info-panel {
                top: auto; bottom: 0; left: 0; right: 0; width: 100%; height: 70vh;
                background: var(--bg-elevated, #0e0e14);
                border-left: none; border-top: 1px solid rgba(255,255,255,0.08);
                border-radius: 20px 20px 0 0; transform: translateY(100%);
                padding: 24px 20px 40px;
            }
            .info-panel.open { transform: translateY(0); }
            .info-panel-close { top: 12px; right: 12px; }
        }

        /* Moon cards removed — details via click panel */

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MOONS = [
    { name: 'Emberhowl', order: 'Flame', color: '#FF6B00', cycle: 18, wizards: 18, radius: 4.5, inclination: 0.1, size: 0.35,
      lore: "The fire-moon. Its surface is cracked volcanic stone threaded with rivers of molten light. Orange and blazing, it pours warmth and courage across Pawtheon. When full, lava flows visible from orbit surge across its face and Flame magic reaches its peak." },
    { name: 'Solaris', order: 'Radiant', color: '#F1C40F', cycle: 12, wizards: 12, radius: 6.0, inclination: -0.15, size: 0.32,
      lore: "A miniature sun suspended in the sky. Golden radiating rays stripe its surface like a crown of light, with darker sunspots marking where truth has burned too deep. Yellow and truth-bearing, it cuts through every shadow. Its 12-day cycle creates the most dramatic power swings of any Order moon." },
    { name: 'Deepwell', order: 'Deep', color: '#3498DB', cycle: 13, wizards: 13, radius: 7.5, inclination: 0.2, size: 0.33,
      lore: "A vast sphere of living water held in the sky. Deep oceanic currents swirl across its surface, abyssal trenches sinking into impossible blue depths. Massive and patient, it pulls with metaphysical force. When full, the tides of magic rise to their highest point." },
    { name: 'Evergreen', order: 'Wild', color: '#2ECC71', cycle: 18, wizards: 18, radius: 9.0, inclination: -0.08, size: 0.34,
      lore: "A moon that grows. Vine networks crawl across its surface in living patterns, forest canopies breathing with each cycle. Green and singing, everything it touches becomes more alive. When full, the Heartwood tree shivers with sympathetic resonance and new growth explodes across every realm." },
    { name: 'Umbra', order: 'Arcane', color: '#9B6EFF', cycle: 14, wizards: 14, radius: 10.5, inclination: 0.25, size: 0.3,
      lore: "The hidden moon. Geometric runes pulse beneath its purple surface like veins of buried knowledge, arcane grids flickering in and out of visibility. It reveals the secret threads connecting stone to star. When full, patterns emerge that even the Archivum cannot record." },
    { name: 'Roseglow', order: 'Dream', color: '#FF69B4', cycle: 11, wizards: 11, radius: 12.0, inclination: -0.18, size: 0.31,
      lore: "A moon of soft petals and drifting clouds. Ethereal swirls of magenta drift across its face like falling petals in slow motion, opening the sleeping mind to worlds behind closed eyes. The fastest Order moon, its 11-day cycle means Dream Wizards ride emotional waves that never fully calm." },
    { name: 'Palehowl', order: 'Starter', color: '#dddddd', cycle: 30, wizards: 0, radius: 14.0, inclination: 0.12, size: 0.2,
      lore: "The smallest, faintest moon. A ghostly sphere of pale silver marked by only the subtlest craters, barely more than a whisper against the dark. The moon of possibility, of every dog who would ever live but had not yet been born. The Wanderer resonates with Palehowl alone." },
];

const isMobile = window.innerWidth < 768;
const canvas = document.getElementById('orrery-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.012);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(12, 8, 18);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 50;
controls.maxPolarAngle = Math.PI * 0.85;
controls.target.set(0, 0, 0);

// Ambient light
scene.add(new THREE.AmbientLight(0x222233, 0.5));
const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
sunLight.position.set(20, 15, 10);
scene.add(sunLight);

// ── Stars ──
const starCount = isMobile ? 1000 : 2000;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 160;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, sizeAttenuation: true })));

// ── Pawtheon (central planet with 7 realms) ──
// Use Icosahedron for better sphere distribution, then displace
const planetDetail = isMobile ? 3 : 4;
const planetGeo = new THREE.IcosahedronGeometry(2.2, planetDetail);

// Noise functions for terrain
function noise3D(x, y, z) {
    return Math.sin(x * 3.7) * Math.cos(y * 4.3) * Math.sin(z * 5.1) +
           Math.sin(x * 8.2 + y * 2.1) * Math.cos(z * 6.7) * 0.5 +
           Math.sin(x * 15.3 + z * 8.8) * Math.cos(y * 12.4) * 0.25;
}
function fbm(x, y, z, octaves = 4) {
    let value = 0, amplitude = 1, frequency = 1;
    for (let i = 0; i < octaves; i++) {
        value += noise3D(x * frequency, y * frequency, z * frequency) * amplitude;
        amplitude *= 0.5;
        frequency *= 2;
    }
    return value;
}

// 7 realm regions mapped to spherical coordinates
// Each realm has a center (theta, phi), color palette, and terrain height
const realmRegions = [
    { name:'Frosthollow',      theta:-0.6, phi: 2.4,  r:0.85,g:0.92,b:1.0,  r2:0.6,g2:0.75,b2:0.95, height: 0.35, roughness: 0.9 },
    { name:'Abyssal Reaches',  theta: 0.0, phi: 2.8,  r:0.15,g:0.25,b:0.45, r2:0.1,g2:0.2,b2:0.4,   height: 0.1, roughness: 0.3 },
    { name:'Sunward Heights',  theta: 0.6, phi: 2.4,  r:1.0,g:0.92,b:0.7,   r2:0.95,g2:0.85,b2:0.6, height: 0.25, roughness: 0.6 },
    { name:'Ember Wastes',     theta: 0.8, phi: 1.2,  r:0.5,g:0.18,b:0.05,  r2:0.3,g2:0.1,b2:0.02,  height: 0.4, roughness: 1.0 },
    { name:'Deepwood',         theta: 0.4, phi: 0.6,  r:0.1,g:0.35,b:0.08,  r2:0.15,g2:0.45,b2:0.12, height: 0.2, roughness: 0.7 },
    { name:'Violet Highlands', theta:-0.5, phi: 0.8,  r:0.4,g:0.22,b:0.5,   r2:0.3,g2:0.18,b2:0.4,  height: 0.45, roughness: 0.8 },
    { name:'Shadowmire',       theta: 0.0, phi: 0.4,  r:0.12,g:0.15,b:0.08, r2:0.08,g2:0.1,b2:0.05,  height: 0.05, roughness: 0.4 },
    { name:'Starter Lands',    theta: 0.0, phi: 1.57, r:0.35,g:0.5,b:0.3,   r2:0.4,g2:0.55,b2:0.35, height: 0.15, roughness: 0.5 },
];

const colors = new Float32Array(planetGeo.attributes.position.count * 3);
const posArr = planetGeo.attributes.position.array;
const _v = new THREE.Vector3();

for (let i = 0; i < planetGeo.attributes.position.count; i++) {
    _v.set(posArr[i*3], posArr[i*3+1], posArr[i*3+2]).normalize();
    const theta = Math.atan2(_v.x, _v.z); // -PI to PI
    const phi = Math.acos(_v.y);           // 0 (north) to PI (south)

    // Find closest realm - sharper boundaries
    let closestRealm = null;
    let minDist = Infinity;
    let secondMinDist = Infinity;
    
    for (const realm of realmRegions) {
        const dTheta = theta - realm.theta;
        const dPhi = phi - realm.phi;
        const dist = Math.sqrt(dTheta * dTheta + dPhi * dPhi);
        if (dist < minDist) {
            secondMinDist = minDist;
            minDist = dist;
            closestRealm = realm;
        } else if (dist < secondMinDist) {
            secondMinDist = dist;
        }
    }

    // Calculate blend factor - sharper transition between realms
    const blendWidth = 0.25;
    const edgeFactor = Math.max(0, Math.min(1, (secondMinDist - minDist) / blendWidth));
    
    // Noise for texture variation within realms
    const noiseVal = fbm(_v.x * 3, _v.y * 3, _v.z * 3, 2);
    
    if (closestRealm && minDist < 1.4) {
        // Mix between primary and secondary color based on noise
        const t = 0.3 + noiseVal * 0.4; // 0.1 to 0.7 range
        let r = closestRealm.r * (1-t) + closestRealm.r2 * t;
        let g = closestRealm.g * (1-t) + closestRealm.g2 * t;
        let b = closestRealm.b * (1-t) + closestRealm.b2 * t;
        
        // Add subtle variation
        r += noiseVal * 0.08;
        g += noiseVal * 0.08;
        b += noiseVal * 0.08;
        
        // At realm boundaries, blend to ocean
        if (edgeFactor < 0.3) {
            const oceanBlend = 1 - edgeFactor / 0.3;
            r = r * (1-oceanBlend) + 0.08 * oceanBlend;
            g = g * (1-oceanBlend) + 0.25 * oceanBlend;
            b = b * (1-oceanBlend) + 0.55 * oceanBlend;
        }
        
        colors[i*3] = Math.max(0, Math.min(1, r));
        colors[i*3+1] = Math.max(0, Math.min(1, g));
        colors[i*3+2] = Math.max(0, Math.min(1, b));
    } else {
        // Deep ocean
        const t = Math.random() * 0.15 + noiseVal * 0.1;
        colors[i*3] = 0.03 + t * 0.08;
        colors[i*3+1] = 0.12 + t * 0.15;
        colors[i*3+2] = 0.35 + t * 0.25;
    }
}

// Topography: displace vertices outward based on realm + improved noise
const topoNormals = [];
for (let i = 0; i < planetGeo.attributes.position.count; i++) {
    const px = posArr[i*3], py = posArr[i*3+1], pz = posArr[i*3+2];
    const n = _v.set(px, py, pz).normalize();
    topoNormals.push(n.x, n.y, n.z);

    const theta = Math.atan2(n.x, n.z);
    const phi = Math.acos(n.y);

    // Find dominant realm for this vertex
    let dominantRealm = null;
    let maxWeight = 0;
    for (const realm of realmRegions) {
        const dTheta = theta - realm.theta;
        const dPhi = phi - realm.phi;
        const dist = Math.sqrt(dTheta * dTheta + dPhi * dPhi);
        const w = Math.pow(Math.max(0, 1 - dist / 1.5), 2);
        if (w > maxWeight) {
            maxWeight = w;
            dominantRealm = realm;
        }
    }

    // Base terrain noise using FBM
    let height = fbm(px, py, pz, 4) * 0.5;

    // Apply realm-specific terrain characteristics
    if (dominantRealm && maxWeight > 0.3) {
        // Scale height by realm's defined height multiplier
        height *= dominantRealm.height;

        // Realm-specific terrain features
        if (dominantRealm.name === 'Frosthollow') {
            // Sharp peaks
            height = Math.pow(Math.abs(height), 0.7) * Math.sign(height);
        } else if (dominantRealm.name === 'Ember Wastes') {
            // Volcanic ridges - add directional noise
            const ridge = Math.sin(px * 8 + pz * 6) * Math.cos(py * 10);
            height += ridge * 0.2;
        } else if (dominantRealm.name === 'Violet Highlands') {
            // Terraced effect
            height = Math.round(height * 3) / 3;
        } else if (dominantRealm.name === 'Shadowmire') {
            // Very flat with occasional bumps
            height *= 0.3;
            height += Math.sin(px * 20) * Math.sin(pz * 20) * 0.05;
        } else if (dominantRealm.name === 'Abyssal Reaches') {
            // Underwater trenches (negative height)
            height -= 0.15;
        }
    }

    // Ocean areas: flatten and lower
    const isOcean = (colors[i*3+2] > 0.35 && colors[i*3] < 0.15);
    if (isOcean) {
        height = height * 0.1 - 0.08;
    }

    // Apply displacement along normal - AMPLIFIED for visibility
    const displacement = height * 0.6;
    posArr[i*3] += n.x * displacement;
    posArr[i*3+1] += n.y * displacement;
    posArr[i*3+2] += n.z * displacement;
}
planetGeo.attributes.position.needsUpdate = true;
planetGeo.computeVertexNormals();

planetGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

// ── Procedural Moon Surface Textures ──
function createMoonTexture(type, colorHex, size = 512) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const w = size, h = size;
    
    // Helper: pseudo-random noise
    function noise(x, y, scale = 1) {
        return Math.sin(x * scale * 12.9898 + y * scale * 78.233) * 43758.5453 % 1;
    }
    function fbm(x, y, octaves = 4) {
        let v = 0, a = 0.5, f = 1;
        for (let i = 0; i < octaves; i++) {
            v += a * (Math.sin(x * f * 3.7) * Math.cos(y * f * 4.3) + Math.sin(x * f * 8.2 + y * f * 2.1) * 0.5);
            a *= 0.5; f *= 2;
        }
        return v;
    }
    
    const baseColor = new THREE.Color(colorHex);
    const r = Math.round(baseColor.r * 255);
    const g = Math.round(baseColor.g * 255);
    const b = Math.round(baseColor.b * 255);
    
    // Fill base
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, 0, w, h);
    
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;
    
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const nx = x / w, ny = y / h;
            
            if (type === 'emberhowl') {
                // Volcanic surface: lava cracks, fire pits, scorched rock
                const n1 = fbm(nx, ny, 3);
                const n2 = fbm(nx * 2 + 10, ny * 2 + 5, 2);
                const crack = Math.abs(n1 - n2) > 0.3 ? 1 : 0;
                const hotspot = fbm(nx * 3, ny * 3 + 20, 2) > 0.4 ? 1 : 0;
                
                data[i] = Math.min(255, r + crack * 80 + hotspot * 60 + n1 * 40);
                data[i+1] = Math.max(0, Math.min(255, g - crack * 40 + hotspot * 30 + n2 * 20));
                data[i+2] = Math.max(0, Math.min(255, b - crack * 60 + hotspot * 10));
                
            } else if (type === 'solaris') {
                // Radiant sun: bright rays, sunspots, golden radiance
                const dist = Math.sqrt((nx - 0.5) ** 2 + (ny - 0.5) ** 2);
                const ray = Math.atan2(ny - 0.5, nx - 0.5);
                const rayPattern = Math.sin(ray * 12 + fbm(nx, ny, 2) * 3) * 0.5 + 0.5;
                const sunspot = fbm(nx * 4, ny * 4, 3) < 0.3 ? 0.7 : 1;
                const corona = Math.max(0, 1 - dist * 2.5);
                
                data[i] = Math.min(255, r + rayPattern * 40 + corona * 60 * sunspot);
                data[i+1] = Math.min(255, g + rayPattern * 50 + corona * 50 * sunspot);
                data[i+2] = Math.max(0, Math.min(255, b + rayPattern * 10 + corona * 20));
                
            } else if (type === 'deepwell') {
                // Deep ocean: water ripples, depth layers, abyssal trenches
                const wave1 = Math.sin(nx * 20 + ny * 8) * 0.5 + 0.5;
                const wave2 = Math.sin(nx * 15 - ny * 12 + 2) * 0.5 + 0.5;
                const depth = fbm(nx * 2, ny * 2, 4);
                const trench = depth < 0.25 ? 0.6 : 1;
                
                data[i] = Math.max(0, Math.min(255, r * 0.3 - depth * 30));
                data[i+1] = Math.max(0, Math.min(255, g * 0.6 + wave1 * 20 + wave2 * 15 - depth * 20));
                data[i+2] = Math.min(255, b + wave1 * 30 + wave2 * 25 + depth * 40 * trench);
                
            } else if (type === 'evergreen') {
                // Living world: forest canopy, vines, organic growth patterns
                const vine = Math.sin(nx * 30) * Math.cos(ny * 25) * 0.5 + 0.5;
                const canopy = fbm(nx * 3, ny * 3, 3);
                const growth = Math.sin(nx * 8 + ny * 6 + canopy * 4) * 0.5 + 0.5;
                const leaf = Math.random() > 0.97 ? 1 : 0;
                
                data[i] = Math.max(0, Math.min(255, r * 0.4 + canopy * 30 - vine * 20));
                data[i+1] = Math.min(255, g + canopy * 40 + growth * 30 + leaf * 50);
                data[i+2] = Math.max(0, Math.min(255, b * 0.5 + canopy * 20 + vine * 15));
                
            } else if (type === 'umbra') {
                // Hidden knowledge: geometric runes, purple veins, arcane patterns
                const grid = ((Math.floor(nx * 16) + Math.floor(ny * 16)) % 2) * 0.1;
                const rune = fbm(nx * 5, ny * 5, 2) > 0.55 ? 1 : 0;
                const vein = Math.abs(fbm(nx * 4, ny * 4, 3) - fbm(nx * 4 + 0.1, ny * 4, 3)) > 0.15 ? 1 : 0;
                const pulse = Math.sin(nx * 20 + ny * 15) * 0.5 + 0.5;
                
                data[i] = Math.min(255, r + grid * 100 + rune * 60 + vein * 40 + pulse * 20);
                data[i+1] = Math.max(0, Math.min(255, g * 0.4 + grid * 30 + rune * 30 + vein * 20));
                data[i+2] = Math.min(255, b + grid * 80 + rune * 50 + vein * 60 + pulse * 30);
                
            } else if (type === 'roseglow') {
                // Dreamy pink: soft clouds, petals, ethereal swirls
                const cloud = fbm(nx * 2 + 50, ny * 2 + 50, 3);
                const swirl = Math.sin(Math.sqrt((nx - 0.5) ** 2 + (ny - 0.5) ** 2) * 15 - Math.atan2(ny - 0.5, nx - 0.5) * 3) * 0.5 + 0.5;
                const petal = Math.sin(nx * 12) * Math.sin(ny * 12) * Math.sin((nx + ny) * 8) > 0.6 ? 1 : 0;
                
                data[i] = Math.min(255, r + cloud * 40 + swirl * 30 + petal * 50);
                data[i+1] = Math.max(0, Math.min(255, g * 0.5 + cloud * 20 + swirl * 15));
                data[i+2] = Math.min(255, b + cloud * 35 + swirl * 25 + petal * 30);
                
            } else if (type === 'palehowl') {
                // Ghostly pale: subtle craters, faint markings, barely visible
                const crater = fbm(nx * 3, ny * 3, 2);
                const craterRing = Math.abs(crater - 0.5) < 0.08 ? 0.7 : 1;
                const faint = fbm(nx * 8, ny * 8, 2) * 0.15;
                
                data[i] = Math.min(255, r + faint * 80 + craterRing * 15);
                data[i+1] = Math.min(255, g + faint * 80 + craterRing * 15);
                data[i+2] = Math.min(255, b + faint * 80 + craterRing * 15);
            }
        }
    }
    
    ctx.putImageData(imgData, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

function createMoonBumpMap(type, size = 512) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, size, size);
    
    const imgData = ctx.getImageData(0, 0, size, size);
    const data = imgData.data;
    
    for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
            const i = (y * size + x) * 4;
            const nx = x / size, ny = y / size;
            let h = 0;
            
            if (type === 'emberhowl') {
                const n1 = Math.sin(nx * 20) * Math.cos(ny * 15);
                const n2 = Math.sin(nx * 35 + 5) * Math.cos(ny * 25 + 3);
                h = 128 + (n1 * 30 + n2 * 20);
                // Cracks go deep
                if (Math.abs(n1 - n2) > 0.4) h = 60;
            } else if (type === 'solaris') {
                const dist = Math.sqrt((nx - 0.5) ** 2 + (ny - 0.5) ** 2);
                h = 128 + (1 - dist * 2) * 40 * Math.sin(Math.atan2(ny - 0.5, nx - 0.5) * 8);
            } else if (type === 'deepwell') {
                h = 128 + Math.sin(nx * 25) * Math.cos(ny * 20) * 25 + Math.sin(nx * 15 - ny * 12) * 15;
            } else if (type === 'evergreen') {
                h = 128 + Math.sin(nx * 18 + ny * 12) * 30 + Math.cos(nx * 30) * Math.sin(ny * 25) * 15;
            } else if (type === 'umbra') {
                const grid = ((Math.floor(nx * 16) + Math.floor(ny * 16)) % 2);
                h = grid ? 160 : 100;
                if (Math.sin(nx * 20) * Math.cos(ny * 20) > 0.7) h = 180;
            } else if (type === 'roseglow') {
                h = 128 + Math.sin(Math.sqrt((nx - 0.5) ** 2 + (ny - 0.5) ** 2) * 12) * 25;
            } else if (type === 'palehowl') {
                const crater = Math.sin(nx * 8) * Math.cos(ny * 8) + Math.sin(nx * 15 + 2) * Math.cos(ny * 12 + 1);
                h = 128 + crater * 15;
            }
            
            data[i] = data[i+1] = data[i+2] = Math.max(0, Math.min(255, h));
            data[i+3] = 255;
        }
    }
    
    ctx.putImageData(imgData, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

function createGlowTexture(hexColor) {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, hexColor + 'aa');
    grad.addColorStop(0.4, hexColor + '44');
    grad.addColorStop(1, hexColor + '00');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    return tex;
}

function createTextSprite(text, color) {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 64;
    const ctx = c.getContext('2d');
    ctx.font = 'bold 28px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(text, 128, 32);
    const tex = new THREE.CanvasTexture(c);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
    return new THREE.Sprite(mat);
}

// ── Phase helpers ──
const PHASE_NAMES = ['New', 'Waxing Crescent', 'First Quarter', 'Waxing Gibbous', 'Full', 'Waning Gibbous', 'Third Quarter', 'Waning Crescent'];
function getPhase(time, cycle) {
    const p = ((time * 0.05) % cycle) / cycle; // 0-1
    return p;
}
function getPhaseName(p) {
    const idx = Math.floor(p * 8) % 8;
    return PHASE_NAMES[idx];
}
function getMagicPower(p) {
    // fullness peaks at 0.5
    const fullness = 1 - Math.abs(p - 0.5) * 2; // 0 at new, 1 at full
    if (fullness > 0.8) return 'Surging';
    if (fullness > 0.5) return 'Strong';
    if (fullness > 0.2) return 'Dim';
    return 'Dormant';
}

// ── Interaction ──
function onPointerMove(e) {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
let _downX = 0, _downY = 0;
function onPointerDown(e) {
    _downX = e.clientX; _downY = e.clientY;
}
function onPointerUp(e) {
    const dx = e.clientX - _downX, dy = e.clientY - _downY;
    if (Math.abs(dx) > 15 || Math.abs(dy) > 15) return; // was a drag, not a click
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(moonMeshes);
    if (hits.length > 0) {
        const idx = hits[0].object.userData.moonIndex;
        selectedMoon = MOONS[idx];
        showMoonInfo(selectedMoon, performance.now() * 0.001);
    }
}
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointerup', onPointerUp);

// SEO cards removed — moon details shown via click panel

// ── Animation ──
let _moonsTabVisible = true;
document.addEventListener('visibilitychange', () => { _moonsTabVisible = !document.hidden; });
function animate() {
    requestAnimationFrame(animate);
    if (!_moonsTabVisible) return;
    const t = performance.now() * 0.001;

    // Rotate planet
    planet.rotation.y = t * 0.15;
    planet.rotation.x = Math.sin(t * 0.03) * 0.1; // subtle axial tilt wobble
    
    // Rotate atmosphere and clouds
    atmosphere.rotation.y = t * 0.12;
    clouds.rotation.y = t * 0.08;
    clouds.rotation.z = Math.sin(t * 0.02) * 0.05;

    // Update moons
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(moonMeshes);
    const hitIdx = hits.length > 0 ? hits[0].object.userData.moonIndex : -1;

    moonGroups.forEach((g, i) => {
        const m = MOONS[i];
        const d = g.userData;
        d.angle += d.speed * 0.016;
        const a = d.angle;

        // Position on orbit
        const x = Math.cos(a) * m.radius;
        const z = Math.sin(a) * m.radius;
        const y = Math.sin(m.inclination) * Math.sin(a) * m.radius * 0.15;
        m._mesh.position.set(x, y, z);

        // Slow axial rotation to show surface detail
        m._mesh.rotation.y += m._rotSpeed * 0.016;

        // Phase shadow rotation
        const phase = getPhase(t, m.cycle);
        const shadowAngle = phase * Math.PI * 2;
        m._shadow.rotation.y = shadowAngle;

        // Hover effect
        const isHovered = (hitIdx === i);
        const targetScale = isHovered ? 1.25 : 1.0;
        const cs = m._mesh.scale.x;
        const ns = cs + (targetScale - cs) * 0.1;
        m._mesh.scale.setScalar(ns);
        m._glowSprite.material.opacity = isHovered ? 0.8 : (MOON_TYPES[i] === 'palehowl' ? 0.2 : 0.4);
        canvas.style.cursor = isHovered ? 'pointer' : 'default';
    });

    controls.update();
    renderer.render(scene, camera);
}
animate();

// ── Resize ──
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});


</script>
